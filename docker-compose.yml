services:
  backend:
    build: ./backend
    container_name: cyberrakshak-backend
    environment:
      - PROJECT_NAME=CyberRakshak AI
      - DEBUG=true
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: cyberrakshak-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"
    restart: unless-stopped
